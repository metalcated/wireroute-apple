name: Signed macOS Release

on:
  push:
    tags:
      - "[0-9]*.[0-9]*.[0-9]*"
  workflow_dispatch:
    inputs:
      tag:
        description: Existing semantic-version tag to package
        required: true
        default: "1.0.17"
        type: string

concurrency:
  group: signed-macos-release-${{ github.event_name == 'workflow_dispatch' && inputs.tag || github.ref_name }}
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  package:
    name: Sign, notarize, and publish macOS DMG
    runs-on: macos-26
    environment: WireRouteENV
    permissions:
      contents: write
    env:
      DEVELOPER_DIR: /Applications/Xcode_26.6.app/Contents/Developer
      RELEASE_TAG: ${{ github.event_name == 'workflow_dispatch' && inputs.tag || github.ref_name }}
      WORKFLOW_SHA: ${{ github.workflow_sha }}
      APPLE_TEAM_ID: ${{ vars.APPLE_TEAM_ID }}
      ASC_API_KEY_ID: ${{ vars.ASC_API_KEY_ID }}
      ASC_API_ISSUER_ID: ${{ vars.ASC_API_ISSUER_ID }}
      ASC_API_KEY_P8_BASE64: ${{ secrets.ASC_API_KEY_P8_BASE64 }}
      MACOS_APPLE_DEVELOPMENT_P12_BASE64: ${{ secrets.MACOS_APPLE_DEVELOPMENT_P12_BASE64 }}
      MACOS_APPLE_DEVELOPMENT_P12_PASSWORD: ${{ secrets.MACOS_APPLE_DEVELOPMENT_P12_PASSWORD }}
      MACOS_DEVELOPER_ID_P12_BASE64: ${{ secrets.MACOS_DEVELOPER_ID_P12_BASE64 }}
      MACOS_DEVELOPER_ID_P12_PASSWORD: ${{ secrets.MACOS_DEVELOPER_ID_P12_PASSWORD }}
      GH_TOKEN: ${{ github.token }}

    steps:
      - name: Check out tagged source
        uses: actions/checkout@v5
        with:
          ref: ${{ env.RELEASE_TAG }}
          fetch-depth: 0

      - name: Validate release metadata and secrets
        shell: bash
        run: |
          set -euo pipefail

          if [[ ! "${RELEASE_TAG}" =~ ^[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
            echo "Release tag must use MAJOR.MINOR.PATCH format; received ${RELEASE_TAG}."
            exit 1
          fi

          version="$(sed -n 's/^MARKETING_VERSION = //p' Sources/WireGuardApp/Config/Version.xcconfig)"
          if [[ "${RELEASE_TAG}" != "${version}" ]]; then
            echo "Release tag ${RELEASE_TAG} does not match MARKETING_VERSION ${version}."
            exit 1
          fi

          if [[ ! "${APPLE_TEAM_ID}" =~ ^[A-Z0-9]{10}$ ]]; then
            echo "APPLE_TEAM_ID is missing or invalid."
            exit 1
          fi

          for required_name in \
            ASC_API_KEY_ID \
            ASC_API_ISSUER_ID \
            ASC_API_KEY_P8_BASE64 \
            MACOS_APPLE_DEVELOPMENT_P12_BASE64 \
            MACOS_APPLE_DEVELOPMENT_P12_PASSWORD \
            MACOS_DEVELOPER_ID_P12_BASE64 \
            MACOS_DEVELOPER_ID_P12_PASSWORD
          do
            if [[ -z "${!required_name:-}" ]]; then
              echo "Required release secret ${required_name} is missing."
              exit 1
            fi
          done

          git rev-parse --verify "refs/tags/${RELEASE_TAG}^{commit}" >/dev/null

      - name: Set up Go
        uses: actions/setup-go@v6
        with:
          go-version: "1.27.0"
          cache: false

      - name: Show release tool versions
        run: |
          xcodebuild -version
          swift --version
          go version
          gh --version
          xcrun notarytool --version

      - name: Prepare signing material
        shell: bash
        run: |
          set -euo pipefail

          development_certificate_path="${RUNNER_TEMP}/apple-development.p12"
          distribution_certificate_path="${RUNNER_TEMP}/developer-id-application.p12"
          keychain_path="${RUNNER_TEMP}/wireroute-signing.keychain-db"
          keychain_password="$(openssl rand -hex 32)"
          api_key_directory="${RUNNER_TEMP}/private_keys"
          api_key_path="${api_key_directory}/AuthKey_${ASC_API_KEY_ID}.p8"

          printf '%s' "${MACOS_APPLE_DEVELOPMENT_P12_BASE64}" | \
            base64 -D -o "${development_certificate_path}"
          printf '%s' "${MACOS_DEVELOPER_ID_P12_BASE64}" | \
            base64 -D -o "${distribution_certificate_path}"
          mkdir -p "${api_key_directory}"
          printf '%s' "${ASC_API_KEY_P8_BASE64}" | base64 -D -o "${api_key_path}"
          chmod 600 \
            "${development_certificate_path}" \
            "${distribution_certificate_path}" \
            "${api_key_path}"

          security create-keychain -p "${keychain_password}" "${keychain_path}"
          security set-keychain-settings -lut 21600 "${keychain_path}"
          security unlock-keychain -p "${keychain_password}" "${keychain_path}"
          security import "${development_certificate_path}" \
            -P "${MACOS_APPLE_DEVELOPMENT_P12_PASSWORD}" \
            -A \
            -t cert \
            -f pkcs12 \
            -k "${keychain_path}"
          security import "${distribution_certificate_path}" \
            -P "${MACOS_DEVELOPER_ID_P12_PASSWORD}" \
            -A \
            -t cert \
            -f pkcs12 \
            -k "${keychain_path}"
          security set-key-partition-list \
            -S apple-tool:,apple:,codesign: \
            -s \
            -k "${keychain_password}" \
            "${keychain_path}"
          security list-keychains -d user -s "${keychain_path}"

          identities="$(security find-identity -v -p codesigning "${keychain_path}")"
          if ! grep -q 'Apple Development' <<< "${identities}"; then
            echo "The imported development archive does not contain a usable Apple Development identity."
            exit 1
          fi

          signing_identity_hash="$(awk '/Developer ID Application/ { print $2; exit }' <<< "${identities}")"
          if [[ -z "${signing_identity_hash}" ]]; then
            echo "The imported archive does not contain a usable Developer ID Application identity."
            exit 1
          fi

          cp Sources/WireGuardApp/Config/Developer.xcconfig.template \
            Sources/WireGuardApp/Config/Developer.xcconfig
          sed -i '' "s/<team_id>/${APPLE_TEAM_ID}/" \
            Sources/WireGuardApp/Config/Developer.xcconfig

          {
            echo "API_KEY_PATH=${api_key_path}"
            echo "KEYCHAIN_PATH=${keychain_path}"
            echo "SIGNING_IDENTITY_HASH=${signing_identity_hash}"
          } >> "${GITHUB_ENV}"

      - name: Prepare Developer ID system extension project
        shell: bash
        run: |
          set -euo pipefail

          git show "${WORKFLOW_SHA}:Sources/WireGuardApp/UI/macOS/AppDelegate.swift" \
            > Sources/WireGuardApp/UI/macOS/AppDelegate.swift

          project_script_path="${RUNNER_TEMP}/prepare-developer-id-project.mjs"
          git show "${WORKFLOW_SHA}:.github/scripts/prepare-developer-id-project.mjs" \
            > "${project_script_path}"
          node "${project_script_path}" \
            WireGuard.xcodeproj/project.pbxproj \
            Sources/WireGuardNetworkExtension/Info.plist \
            Sources/WireGuardNetworkExtension/DeveloperIDSystemExtensionMain.swift \
            Sources/WireGuardApp/UI/macOS/AppDelegate.swift \
            Sources/WireGuardApp/UI/macOS/LoginItemHelper/main.m \
            Sources/WireGuardApp/UI/macOS/LoginItemHelper/LoginItemHelper.entitlements

          plutil -lint \
            Sources/WireGuardNetworkExtension/Info.plist \
            Sources/WireGuardApp/UI/macOS/LoginItemHelper/LoginItemHelper.entitlements
          grep -q 'com.apple.product-type.system-extension' WireGuard.xcodeproj/project.pbxproj
          grep -q 'dstSubfolderSpec = 16' WireGuard.xcodeproj/project.pbxproj
          grep -q '<string>SYSX</string>' Sources/WireGuardNetworkExtension/Info.plist
          grep -q -- '--wireroute-launched-at-login' Sources/WireGuardApp/UI/macOS/AppDelegate.swift
          grep -q -- '--wireroute-launched-at-login' Sources/WireGuardApp/UI/macOS/LoginItemHelper/main.m
          if /usr/libexec/PlistBuddy \
            -c 'Print :com.apple.security.application-groups' \
            Sources/WireGuardApp/UI/macOS/LoginItemHelper/LoginItemHelper.entitlements \
            >/dev/null 2>&1
          then
            echo 'The Developer ID login helper must not request an App Group.'
            exit 1
          fi
          test -f Sources/WireGuardNetworkExtension/DeveloperIDSystemExtensionMain.swift

      - name: Resolve Swift packages
        run: |
          xcodebuild \
            -project WireGuard.xcodeproj \
            -scheme WireGuardmacOS \
            -resolvePackageDependencies \
            -clonedSourcePackagesDirPath "${RUNNER_TEMP}/source-packages-macos"

      - name: Prepare Developer ID provisioning profiles
        shell: bash
        run: |
          set -euo pipefail

          profile_script_path="${RUNNER_TEMP}/prepare-macos-profiles.mjs"
          git show "${WORKFLOW_SHA}:.github/scripts/prepare-macos-profiles.mjs" \
            > "${profile_script_path}"

          profile_output_directory="${RUNNER_TEMP}/developer-id-profiles"
          profile_result_path="${RUNNER_TEMP}/developer-id-profiles.json"
          PROFILE_OUTPUT_DIRECTORY="${profile_output_directory}" \
          PROFILE_RESULT_PATH="${profile_result_path}" \
            node "${profile_script_path}"

          profile_validation_failed=false
          direct_app_group_id=""
          while IFS=$'\t' read -r bundle_identifier profile_path
          do
            decoded_profile_path="${profile_path}.plist"
            security cms -D -i "${profile_path}" > "${decoded_profile_path}"
            profile_network_extension_values=()
            profile_network_extension_index=0
            while profile_network_extension_value="$(
              /usr/libexec/PlistBuddy \
                -c "Print :Entitlements:com.apple.developer.networking.networkextension:${profile_network_extension_index}" \
                "${decoded_profile_path}" 2>/dev/null
            )"
            do
              profile_network_extension_values+=("${profile_network_extension_value}")
              profile_network_extension_index=$((profile_network_extension_index + 1))
            done
            profile_network_extensions=""
            profile_has_system_extension=false
            for ((index = 0; index < ${#profile_network_extension_values[@]}; index++))
            do
              profile_network_extension_value="${profile_network_extension_values[index]}"
              if [[ -n "${profile_network_extensions}" ]]; then
                profile_network_extensions+=","
              fi
              profile_network_extensions+="${profile_network_extension_value}"
              if [[ "${profile_network_extension_value}" == "packet-tunnel-provider-systemextension" ]]; then
                profile_has_system_extension=true
              fi
            done
            profile_app_group_values=()
            profile_app_group_index=0
            while profile_app_group_value="$(
              /usr/libexec/PlistBuddy \
                -c "Print :Entitlements:com.apple.security.application-groups:${profile_app_group_index}" \
                "${decoded_profile_path}" 2>/dev/null
            )"
            do
              profile_app_group_values+=("${profile_app_group_value}")
              profile_app_group_index=$((profile_app_group_index + 1))
            done
            profile_app_groups=""
            profile_wire_route_app_group=""
            for ((index = 0; index < ${#profile_app_group_values[@]}; index++))
            do
              profile_app_group_value="${profile_app_group_values[index]}"
              if [[ -n "${profile_app_groups}" ]]; then
                profile_app_groups+=","
              fi
              profile_app_groups+="${profile_app_group_value}"
              if [[ "${profile_app_group_value}" == *"group.com.gnet.wireroute" ]]; then
                profile_wire_route_app_group="${profile_app_group_value}"
              fi
            done
            capability_summary="$(
              jq -c --arg identifier "${bundle_identifier}" \
                '.profiles[$identifier].capabilities' \
                "${profile_result_path}"
            )"

            echo "::notice title=Developer ID profile ${bundle_identifier}::appgroups=${profile_app_groups:-missing}; networkextension=${profile_network_extensions:-missing}; capabilities=${capability_summary}"

            if [[ "${bundle_identifier}" == "com.gnet.wireroute.login-item-helper" ]]; then
              :
            elif [[ -z "${profile_wire_route_app_group}" ]]; then
              echo "::error title=Developer ID entitlement mismatch::${bundle_identifier} is missing the WireRoute App Group."
              profile_validation_failed=true
            elif [[ -z "${direct_app_group_id}" ]]; then
              direct_app_group_id="${profile_wire_route_app_group}"
            elif [[ "${profile_wire_route_app_group}" != "${direct_app_group_id}" ]]; then
              echo "::error title=Developer ID entitlement mismatch::${bundle_identifier} authorizes ${profile_wire_route_app_group}, but the other WireRoute components authorize ${direct_app_group_id}."
              profile_validation_failed=true
            fi

            if [[ "${bundle_identifier}" != "com.gnet.wireroute.login-item-helper" ]] && \
              [[ "${profile_has_system_extension}" != true ]]
            then
              echo "::error title=Developer ID entitlement mismatch::${bundle_identifier} requires packet-tunnel-provider-systemextension, but Apple issued ${profile_network_extensions:-no network extension entitlement}."
              profile_validation_failed=true
            fi

            if [[ "${bundle_identifier}" == "com.gnet.wireroute" ]]; then
              system_extension_install="$(
                /usr/libexec/PlistBuddy \
                  -c 'Print :Entitlements:com.apple.developer.system-extension.install' \
                  "${decoded_profile_path}" 2>/dev/null || true
              )"
              if [[ "${system_extension_install}" != "true" ]]; then
                echo "::error title=Developer ID entitlement mismatch::${bundle_identifier} is missing com.apple.developer.system-extension.install."
                profile_validation_failed=true
              fi
            fi
          done < <(
            jq -r '.profiles | to_entries[] | [.key, .value.path] | @tsv' \
              "${profile_result_path}"
          )

          if [[ "${profile_validation_failed}" == true ]]; then
            echo "The Developer ID profiles do not authorize WireRoute's required Network Extension entitlement."
            exit 1
          fi

          main_profile_path="$(jq -er '.profiles["com.gnet.wireroute"].path' "${profile_result_path}")"
          extension_profile_path="$(jq -er '.profiles["com.gnet.wireroute.network-extension"].path' "${profile_result_path}")"
          helper_profile_path="$(jq -er '.profiles["com.gnet.wireroute.login-item-helper"].path' "${profile_result_path}")"
          test -f "${main_profile_path}"
          test -f "${extension_profile_path}"
          test -f "${helper_profile_path}"

          {
            echo "MAIN_PROFILE_PATH=${main_profile_path}"
            echo "EXTENSION_PROFILE_PATH=${extension_profile_path}"
            echo "HELPER_PROFILE_PATH=${helper_profile_path}"
            echo "DIRECT_APP_GROUP_ID=${direct_app_group_id}"
          } >> "${GITHUB_ENV}"

      - name: Archive signed universal app
        run: |
          xcodebuild \
            -project WireGuard.xcodeproj \
            -scheme WireGuardmacOS \
            -configuration Release \
            -destination "generic/platform=macOS" \
            -archivePath "${RUNNER_TEMP}/WireRoute.xcarchive" \
            -clonedSourcePackagesDirPath "${RUNNER_TEMP}/source-packages-macos" \
            -disableAutomaticPackageResolution \
            -allowProvisioningUpdates \
            -authenticationKeyPath "${API_KEY_PATH}" \
            -authenticationKeyID "${ASC_API_KEY_ID}" \
            -authenticationKeyIssuerID "${ASC_API_ISSUER_ID}" \
            DEVELOPMENT_TEAM="${APPLE_TEAM_ID}" \
            CODE_SIGN_STYLE=Automatic \
            ARCHS="arm64 x86_64" \
            ONLY_ACTIVE_ARCH=NO \
            archive

      - name: Assemble and sign Developer ID application
        shell: bash
        run: |
          set -euo pipefail

          archive_app_path="${RUNNER_TEMP}/WireRoute.xcarchive/Products/Applications/WireRoute.app"
          export_directory="${RUNNER_TEMP}/export"
          app_path="${export_directory}/WireRoute.app"
          mkdir -p "${export_directory}"
          ditto "${archive_app_path}" "${app_path}"

          system_extension_path="$(
            find "${app_path}/Contents/Library/SystemExtensions" \
              -mindepth 1 -maxdepth 1 -type d -name '*.systemextension' -print -quit
          )"
          helper_path="${app_path}/Contents/Library/LoginItems/WireRouteLoginItemHelper.app"
          if [[ -z "${system_extension_path}" ]] || [[ ! -d "${helper_path}" ]]; then
            echo "The archived system extension or login item helper is missing."
            exit 1
          fi

          system_extension_identifier="$(
            /usr/libexec/PlistBuddy \
              -c 'Print :CFBundleIdentifier' \
              "${system_extension_path}/Contents/Info.plist"
          )"
          expected_system_extension_name="${system_extension_identifier}.systemextension"
          if [[ "$(basename "${system_extension_path}")" != "${expected_system_extension_name}" ]]; then
            echo "The archived system extension must be named ${expected_system_extension_name}; found $(basename "${system_extension_path}")."
            exit 1
          fi

          app_entitlements="${RUNNER_TEMP}/developer-id-app.entitlements"
          extension_entitlements="${RUNNER_TEMP}/developer-id-extension.entitlements"
          helper_entitlements="${RUNNER_TEMP}/developer-id-helper.entitlements"
          cp Sources/WireGuardApp/UI/macOS/WireGuard.entitlements "${app_entitlements}"
          cp Sources/WireGuardNetworkExtension/WireGuardNetworkExtension_macOS.entitlements \
            "${extension_entitlements}"
          cp Sources/WireGuardApp/UI/macOS/LoginItemHelper/LoginItemHelper.entitlements \
            "${helper_entitlements}"

          /usr/libexec/PlistBuddy \
            -c 'Set :com.apple.developer.networking.networkextension:0 packet-tunnel-provider-systemextension' \
            -c "Set :com.apple.security.application-groups:0 ${DIRECT_APP_GROUP_ID}" \
            "${app_entitlements}"
          /usr/libexec/PlistBuddy \
            -c 'Set :com.apple.developer.networking.networkextension:0 packet-tunnel-provider-systemextension' \
            -c "Set :com.apple.security.application-groups:0 ${DIRECT_APP_GROUP_ID}" \
            "${extension_entitlements}"
          /usr/libexec/PlistBuddy \
            -c "Set :com.wireguard.macos.app_group_id ${DIRECT_APP_GROUP_ID}" \
            "${app_path}/Contents/Info.plist"
          /usr/libexec/PlistBuddy \
            -c "Set :com.wireguard.macos.app_group_id ${DIRECT_APP_GROUP_ID}" \
            "${system_extension_path}/Contents/Info.plist"
          /usr/libexec/PlistBuddy \
            -c 'Delete :com.wireguard.macos.app_group_id' \
            "${helper_path}/Contents/Info.plist"

          /usr/libexec/PlistBuddy \
            -c "Add :com.apple.application-identifier string ${APPLE_TEAM_ID}.com.gnet.wireroute" \
            -c "Add :com.apple.developer.team-identifier string ${APPLE_TEAM_ID}" \
            "${app_entitlements}"
          /usr/libexec/PlistBuddy \
            -c "Add :com.apple.application-identifier string ${APPLE_TEAM_ID}.com.gnet.wireroute.network-extension" \
            -c "Add :com.apple.developer.team-identifier string ${APPLE_TEAM_ID}" \
            "${extension_entitlements}"
          /usr/libexec/PlistBuddy \
            -c "Add :com.apple.application-identifier string ${APPLE_TEAM_ID}.com.gnet.wireroute.login-item-helper" \
            -c "Add :com.apple.developer.team-identifier string ${APPLE_TEAM_ID}" \
            "${helper_entitlements}"
          if /usr/libexec/PlistBuddy \
            -c 'Print :com.apple.developer.system-extension.install' \
            "${app_entitlements}" >/dev/null 2>&1
          then
            /usr/libexec/PlistBuddy \
              -c 'Set :com.apple.developer.system-extension.install true' \
              "${app_entitlements}"
          else
            /usr/libexec/PlistBuddy \
              -c 'Add :com.apple.developer.system-extension.install bool true' \
              "${app_entitlements}"
          fi
          plutil -lint "${app_entitlements}" "${extension_entitlements}" "${helper_entitlements}"

          cp "${MAIN_PROFILE_PATH}" "${app_path}/Contents/embedded.provisionprofile"
          cp "${EXTENSION_PROFILE_PATH}" "${system_extension_path}/Contents/embedded.provisionprofile"
          cp "${HELPER_PROFILE_PATH}" "${helper_path}/Contents/embedded.provisionprofile"

          while IFS= read -r framework_path
          do
            codesign \
              --force \
              --timestamp \
              --options runtime \
              --sign "${SIGNING_IDENTITY_HASH}" \
              "${framework_path}"
          done < <(find "${app_path}/Contents/Frameworks" -depth -type d -name '*.framework' -print)

          codesign \
            --force \
            --timestamp \
            --options runtime \
            --generate-entitlement-der \
            --entitlements "${helper_entitlements}" \
            --sign "${SIGNING_IDENTITY_HASH}" \
            "${helper_path}"
          codesign \
            --force \
            --timestamp \
            --options runtime \
            --generate-entitlement-der \
            --entitlements "${extension_entitlements}" \
            --sign "${SIGNING_IDENTITY_HASH}" \
            "${system_extension_path}"
          codesign \
            --force \
            --timestamp \
            --options runtime \
            --generate-entitlement-der \
            --entitlements "${app_entitlements}" \
            --sign "${SIGNING_IDENTITY_HASH}" \
            "${app_path}"

          codesign --verify --deep --strict --verbose=4 "${app_path}"
          final_app_entitlements="$(codesign -d --entitlements - "${app_path}" 2>/dev/null)"
          final_extension_entitlements="$(codesign -d --entitlements - "${system_extension_path}" 2>/dev/null)"

          [[ "$(/usr/libexec/PlistBuddy -c 'Print :CFBundleIdentifier' "${app_path}/Contents/Info.plist")" == 'com.gnet.wireroute' ]]
          [[ "$(/usr/libexec/PlistBuddy -c 'Print :CFBundleIdentifier' "${system_extension_path}/Contents/Info.plist")" == 'com.gnet.wireroute.network-extension' ]]
          [[ "$(/usr/libexec/PlistBuddy -c 'Print :CFBundlePackageType' "${system_extension_path}/Contents/Info.plist")" == 'SYSX' ]]
          grep -q 'com.apple.developer.system-extension.install' <<< "${final_app_entitlements}"
          grep -q 'packet-tunnel-provider-systemextension' <<< "${final_app_entitlements}"
          grep -q 'packet-tunnel-provider-systemextension' <<< "${final_extension_entitlements}"

      - name: Verify and package application
        shell: bash
        run: |
          set -euo pipefail

          app_path="$(find "${RUNNER_TEMP}/export" -maxdepth 2 -type d -name 'WireRoute.app' -print -quit)"
          if [[ -z "${app_path}" ]]; then
            echo "WireRoute.app was not found in the Developer ID assembly."
            exit 1
          fi

          codesign --verify --deep --strict --verbose=2 "${app_path}"

          executable_path="${app_path}/Contents/MacOS/WireRoute"
          system_extension_path="$(
            find "${app_path}/Contents/Library/SystemExtensions" \
              -mindepth 1 -maxdepth 1 -type d -name '*.systemextension' -print -quit
          )"
          system_extension_executable="${system_extension_path}/Contents/MacOS/$(
            /usr/libexec/PlistBuddy \
              -c 'Print :CFBundleExecutable' \
              "${system_extension_path}/Contents/Info.plist"
          )"
          for required_architecture in arm64 x86_64
          do
            for binary_path in "${executable_path}" "${system_extension_executable}"
            do
              architectures="$(lipo -archs "${binary_path}")"
              if ! grep -qw "${required_architecture}" <<< "${architectures}"; then
                echo "${binary_path} is missing the ${required_architecture} architecture."
                exit 1
              fi
            done
          done

          staging_path="${RUNNER_TEMP}/dmg-root"
          mkdir -p "${staging_path}"
          ditto "${app_path}" "${staging_path}/WireRoute.app"
          ln -s /Applications "${staging_path}/Applications"

          dmg_name="WireRoute-${RELEASE_TAG}-macOS-universal.dmg"
          dmg_path="${RUNNER_TEMP}/${dmg_name}"
          hdiutil create \
            -volname WireRoute \
            -srcfolder "${staging_path}" \
            -ov \
            -format UDZO \
            "${dmg_path}"
          codesign \
            --force \
            --timestamp \
            --sign "${SIGNING_IDENTITY_HASH}" \
            "${dmg_path}"

          echo "DMG_NAME=${dmg_name}" >> "${GITHUB_ENV}"
          echo "DMG_PATH=${dmg_path}" >> "${GITHUB_ENV}"

      - name: Notarize and staple disk image
        run: |
          xcrun notarytool submit "${DMG_PATH}" \
            --key "${API_KEY_PATH}" \
            --key-id "${ASC_API_KEY_ID}" \
            --issuer "${ASC_API_ISSUER_ID}" \
            --wait
          xcrun stapler staple "${DMG_PATH}"
          xcrun stapler validate "${DMG_PATH}"
          codesign --verify --verbose=2 "${DMG_PATH}"
          spctl --assess \
            --type open \
            --context context:primary-signature \
            --verbose=4 \
            "${DMG_PATH}"

      - name: Generate checksum
        shell: bash
        run: |
          set -euo pipefail
          checksum_path="${DMG_PATH}.sha256"
          (
            cd "$(dirname "${DMG_PATH}")"
            shasum -a 256 "$(basename "${DMG_PATH}")" > "${checksum_path}"
          )
          echo "CHECKSUM_PATH=${checksum_path}" >> "${GITHUB_ENV}"

      - name: Attach installer to GitHub release
        shell: bash
        run: |
          set -euo pipefail

          if ! gh release view "${RELEASE_TAG}" --repo "${GITHUB_REPOSITORY}" >/dev/null 2>&1; then
            gh release create "${RELEASE_TAG}" \
              --repo "${GITHUB_REPOSITORY}" \
              --title "WireRoute ${RELEASE_TAG}" \
              --generate-notes
          fi

          gh release upload "${RELEASE_TAG}" \
            "${DMG_PATH}" \
            "${CHECKSUM_PATH}" \
            --repo "${GITHUB_REPOSITORY}" \
            --clobber

      - name: Describe signed installer on release
        uses: actions/github-script@v8
        env:
          ASSET_NAME: ${{ env.DMG_NAME }}
          TAG_NAME: ${{ env.RELEASE_TAG }}
        with:
          script: |
            const { owner, repo } = context.repo;
            const tag = process.env.TAG_NAME;
            const assetName = process.env.ASSET_NAME;
            const release = await github.rest.repos.getReleaseByTag({ owner, repo, tag });

            let body = release.data.body || '';
            body = body.replace(
              'GitHub provides the standard source archives for this release. Signed App Store builds are handled through Apple distribution.',
              'A signed and notarized universal macOS installer is attached. iOS builds are distributed through Apple.'
            );

            if (!body.includes('## macOS installer')) {
              const downloadURL = `https://github.com/${owner}/${repo}/releases/download/${tag}/${assetName}`;
              body = `${body.trim()}\n\n## macOS installer\n\n- [${assetName}](${downloadURL}) — Developer ID signed, Apple notarized, and compatible with Apple Silicon and Intel Macs.\n`;
            }

            await github.rest.repos.updateRelease({
              owner,
              repo,
              release_id: release.data.id,
              body
            });

      - name: Remove temporary signing keychain
        if: always()
        shell: bash
        run: |
          if [[ -n "${KEYCHAIN_PATH:-}" ]] && [[ -f "${KEYCHAIN_PATH}" ]]; then
            security delete-keychain "${KEYCHAIN_PATH}"
          fi
